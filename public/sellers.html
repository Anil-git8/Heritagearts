<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verified Tradesmen &amp; Studios - Heritage Marketplace</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body style="background: var(--cres-body-bg);">

  <!-- Reusable Header -->
  <div id="cres-header-placeholder"></div>

  <main class="container my-4 my-md-5">
    
    <!-- Hero Header -->
    <div class="card border-0 rounded-4 p-4 p-md-5 mb-5 shadow-sm text-white position-relative overflow-hidden" style="background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #5B42F3 100%);">
      <div class="row align-items-center position-relative" style="z-index: 2;">
        <div class="col-lg-8">
          <span class="badge rounded-pill bg-white text-primary fw-bold px-3 py-2 mb-3">
            <i class="bi bi-patch-check-fill me-1"></i> Verified Marketplace Artisans
          </span>
          <h1 class="display-5 fw-bold mb-3 text-white" style="font-family: var(--cres-font-heading);">
            Meet Master Tradesmen &amp; Antiquarians
          </h1>
          <p class="lead opacity-90 mb-4 text-white" style="max-width: 600px;">
            Connect directly with verified master painters, lost-wax bronze sculptors, handloom weavers, and heritage antiquarians preserving sacred art traditions.
          </p>
          <a href="/become-tradesman.html" class="btn btn-light rounded-pill px-4 py-2 fw-bold text-primary shadow-sm">
            <i class="bi bi-gem me-1"></i> Apply to Become a Tradesman
          </a>
        </div>
        <div class="col-lg-4 d-none d-lg-block text-center">
          <i class="bi bi-people text-white opacity-25" style="font-size: 10rem;"></i>
        </div>
      </div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="card border-0 shadow-sm rounded-4 p-3 bg-white mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="seller-search" class="form-control border-0 px-2" placeholder="Search by studio name, artist, or craft..." oninput="handleSellerSearch()">
          </div>
        </div>
        <div class="col-sm-6 col-md-4">
          <select id="seller-specialization-filter" class="form-select rounded-pill px-3" onchange="handleSellerSearch()">
            <option value="">All Craft Specializations</option>
            <option value="Traditional Paintings">Traditional Paintings (Tanjore / Madhubani)</option>
            <option value="Antiques">Antiques &amp; Vintage Relics</option>
            <option value="Sculptures">Sculptures &amp; Bronze Castings</option>
            <option value="Handloom">Handloom &amp; Silks</option>
            <option value="Woodworks">Sacred Woodworks</option>
          </select>
        </div>
        <div class="col-sm-6 col-md-3">
          <select id="seller-sort" class="form-select rounded-pill px-3" onchange="handleSellerSearch()">
            <option value="rating">Sort: Highest Rating ★</option>
            <option value="sales">Sort: Most Sales</option>
            <option value="products">Sort: Most Artworks</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Tradesmen Cards Grid -->
    <div class="row g-4" id="sellers-directory-grid">
      <div class="col-12 text-center py-5 text-muted">
        <div class="spinner-border text-primary me-2"></div> Loading verified tradesmen...
      </div>
    </div>

  </main>

  <!-- Footer Placeholder -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/components.js"></script>

  <script>
    let allSellers = [];

    async function loadSellersDirectory() {
      try {
        const search = document.getElementById('seller-search').value;
        const specialization = document.getElementById('seller-specialization-filter').value;
        const sort = document.getElementById('seller-sort').value;

        const res = await api.get('/sellers/directory', { search, specialization, sort });
        const grid = document.getElementById('sellers-directory-grid');

        if (!res.success || !res.data || res.data.length === 0) {
          grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">No verified tradesmen found matching your search.</div>';
          return;
        }

        allSellers = res.data;

        grid.innerHTML = allSellers.map(s => `
          <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100 bg-white d-flex flex-column justify-content-between p-4" style="transition: transform 0.2s ease, box-shadow 0.2s ease;">
              <div>
                <div class="d-flex align-items-center gap-3 mb-3">
                  <img src="${s.avatar || 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80'}" class="rounded-circle border" style="width: 64px; height: 64px; object-fit: cover;">
                  <div>
                    <h5 class="fw-bold mb-0 text-dark">
                      <a href="/seller.html?id=${s.slug || s.id}" class="text-decoration-none text-dark">${s.store_name}</a>
                    </h5>
                    <span class="badge bg-success bg-opacity-10 text-success fw-semibold small mt-1">
                      <i class="bi bi-patch-check-fill me-1"></i>${s.verification_badge || 'Verified Tradesman'}
                    </span>
                  </div>
                </div>

                <p class="text-muted small mb-3 leading-normal" style="min-height: 40px;">${s.tagline || s.specialization || 'Master Artisan'}</p>

                <div class="p-3 bg-light rounded-3 mb-3 small text-muted">
                  <div class="d-flex justify-content-between mb-1">
                    <span><i class="bi bi-geo-alt text-primary me-1"></i>Location:</span>
                    <strong class="text-dark">${s.location || 'India'}</strong>
                  </div>
                  <div class="d-flex justify-content-between mb-1">
                    <span><i class="bi bi-award text-warning me-1"></i>Experience:</span>
                    <strong class="text-dark">${s.experience_years || 1} Years</strong>
                  </div>
                  <div class="d-flex justify-content-between">
                    <span><i class="bi bi-palette text-info me-1"></i>Active Creations:</span>
                    <strong class="text-dark">${s.products_count || 0} Artworks</strong>
                  </div>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                <div class="d-flex align-items-center text-warning fw-bold small">
                  <i class="bi bi-star-fill me-1"></i> ${s.rating || 5.0} <span class="text-muted ms-1 fw-normal">(${s.reviews_count || 0})</span>
                </div>
                <div class="d-flex gap-2">
                  <a href="/chat.html?seller_id=${s.id}" class="btn btn-sm btn-outline-secondary rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 36px; height: 36px;" title="Chat with Seller">
                    <i class="bi bi-chat-text"></i>
                  </a>
                  <a href="/seller.html?id=${s.slug || s.id}" class="btn btn-sm cres-btn-primary rounded-pill px-3 fw-bold">
                    View Storefront →
                  </a>
                </div>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error loading directory:', err);
      }
    }

    let debounceTimer;
    function handleSellerSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadSellersDirectory, 300);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSellersDirectory();
    });
  </script>
</body>
</html>
